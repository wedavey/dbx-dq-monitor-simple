# Assignments: which metrics apply to which tables and columns. Deployed by pull request and
# loaded by the sync task (bundle variable `assignment_files`). See docs/assignments.md.
#
# Format (one block per table; owner and severity fall back table -> defaults):
#
# defaults:
#   owner: team@example.com
#   severity: MEDIUM
# tables:
#   - name: ${catalog}.sales.orders          # ${catalog} is replaced per environment
#     data_product: sales_orders
#     checks:
#       - {column: order_id, metric: duplicate_pct, threshold: 0.0, severity: CRITICAL}
#       - {metric: row_count, threshold: 1000000}
#       - {column: country, metric: regex_fail_pct, threshold: 0.0, params: {regex: '^[A-Z]{2}$'}}
#       - {column: email, metric: null_pct, threshold: 0.0, enabled: false}   # switch a check off
#       # Scope a big table to recent data:
#       - {column: id, metric: null_pct, threshold: 0.0, params: {filter: "load_date >= date_sub(current_date(), 1)"}}

tables: []
