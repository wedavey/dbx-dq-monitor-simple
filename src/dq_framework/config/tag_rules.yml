# Tag rules: how Unity Catalog tags become assignments (the no-code onboarding path).
#
# Governance tags in Catalog Explorer (or with ALTER ... SET TAGS). Nobody writes SQL or thresholds.
#
#   1. Opt the table in:      dq_monitor = true         (+ optional dq_owner, dq_severity, dq_data_product)
#   2. Tag the columns/table: e.g. dq_required, dq_unique, dq_format = email, dq_freshness_hours = 24
#
# Tag names are letters/digits/underscore only (Unity Catalog tag keys cannot contain . - : = /).
# Modes:
#   flag       tag present (value empty or "true") switches the check on at the rule's threshold
#   threshold  the tag value is the threshold, e.g. dq_max_null_pct = 0.02
#   pattern    the tag value picks a named pattern below, e.g. dq_format = email
#
# Severity precedence: table dq_severity tag > rule severity > defaults.severity.
# If two rules give the same check on a column, the first rule in this list wins (and a warning is
# raised), so explicit-threshold rules are listed before flag rules.

prefix: dq_

table_tags:
  monitor: dq_monitor
  owner: dq_owner
  severity: dq_severity
  data_product: dq_data_product

defaults:
  owner: data-governance@example.com   # used when a monitored table has no dq_owner tag
  severity: MEDIUM

rules:
  - tag: dq_max_null_pct
    scope: COLUMN
    metric: null_pct
    mode: threshold
    severity: HIGH

  - tag: dq_required
    scope: COLUMN
    metric: null_pct
    mode: flag
    threshold: 0.0
    severity: HIGH

  - tag: dq_not_blank
    scope: COLUMN
    metric: blank_pct
    mode: flag
    threshold: 0.0

  - tag: dq_unique
    scope: COLUMN
    metric: duplicate_pct
    mode: flag
    threshold: 0.0
    severity: CRITICAL

  - tag: dq_format
    scope: COLUMN
    metric: regex_fail_pct
    mode: pattern
    param: regex
    threshold: 0.01          # up to 1% of non-null values may fail the pattern
    patterns:
      email: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
      iso_country_alpha2: '^[A-Z]{2}$'
      iso_currency: '^[A-Z]{3}$'
      digits_only: '^[0-9]+$'
      au_postcode: '^[0-9]{4}$'
      uuid: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'

  - tag: dq_freshness_hours
    scope: COLUMN
    metric: hours_since_load
    mode: threshold
    severity: HIGH

  - tag: dq_min_rows
    scope: TABLE
    metric: row_count
    mode: threshold
    severity: HIGH
