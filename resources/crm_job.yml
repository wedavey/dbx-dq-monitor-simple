resources:
  jobs:
    crm_contacts:
      name: crm-contacts-${bundle.target}
      # Free Edition has no classic clusters: tasks run on serverless compute
      # via an environment (no job_clusters / new_cluster / existing_cluster_id).
      environments:
        - environment_key: default
          spec:
            environment_version: "3"
            dependencies:
              - ../dist/*.whl
      tasks:
        - task_key: generate
          environment_key: default
          python_wheel_task:
            package_name: crm_demo
            entry_point: generate
            named_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              num_rows: "1000"
        - task_key: cleanse
          depends_on:
            - task_key: generate
          environment_key: default
          python_wheel_task:
            package_name: crm_demo
            entry_point: cleanse
            named_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
